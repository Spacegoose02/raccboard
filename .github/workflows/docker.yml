name: Docker image

# Publishes ghcr.io/spacegoose02/rackboard:
#   push to main      -> latest, sha-<short>
#   tag v1.2.3        -> 1.2.3, 1.2, 1, sha-<short>
#   manual run        -> builds any ref (e.g. v1.0.0) with the same tag rules
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
    inputs:
      ref:
        description: Branch or tag to build (e.g. v1.0.0)
        required: true
        default: main

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/spacegoose02/rackboard

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - name: Work out the ref
        id: ref
        run: |
          REF="${{ github.event_name == 'workflow_dispatch' && inputs.ref || github.ref_name }}"
          echo "ref=$REF" >> "$GITHUB_OUTPUT"
          if [[ "$REF" =~ ^v[0-9]+\.[0-9]+\.[0-9]+ ]]; then echo "tag=true" >> "$GITHUB_OUTPUT"; else echo "tag=false" >> "$GITHUB_OUTPUT"; fi
          if [[ "$REF" == "main" ]]; then echo "main=true" >> "$GITHUB_OUTPUT"; else echo "main=false" >> "$GITHUB_OUTPUT"; fi

      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.ref.outputs.ref }}

      # Always package with this workflow's Dockerfile and entrypoint, so rebuilding an older tag
      # (like v1.0.0) still gets the current container setup (PUID/PGID, labels, multi-arch).
      - uses: actions/checkout@v4
        with:
          path: packaging
          sparse-checkout: |
            Dockerfile
            docker-entrypoint.sh
            .dockerignore
          sparse-checkout-cone-mode: false
      - run: cp packaging/Dockerfile packaging/docker-entrypoint.sh packaging/.dockerignore . && rm -rf packaging

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=latest,enable=${{ steps.ref.outputs.main }}
            type=semver,pattern={{version}},value=${{ steps.ref.outputs.ref }},enable=${{ steps.ref.outputs.tag }}
            type=semver,pattern={{major}}.{{minor}},value=${{ steps.ref.outputs.ref }},enable=${{ steps.ref.outputs.tag }}
            type=semver,pattern={{major}},value=${{ steps.ref.outputs.ref }},enable=${{ steps.ref.outputs.tag }}
            type=sha,format=short
          labels: |
            org.opencontainers.image.title=Rackboard
            org.opencontainers.image.source=https://github.com/Spacegoose02/rackboard
            org.opencontainers.image.licenses=MIT

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: VERSION=${{ steps.meta.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
