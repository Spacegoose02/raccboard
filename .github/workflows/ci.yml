name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Start server
        run: |
          DATA_DIR="$RUNNER_TEMP/data" PORT=3000 npm start > server.log 2>&1 &
          for i in $(seq 1 30); do curl -sf http://localhost:3000/api/health && break; sleep 1; done
      - run: npm run smoke
      - run: npm run smoke:features
      - run: npm run smoke:notifications
      - run: npm run smoke:oidc
      - run: npm run smoke:google
      - run: npm run smoke:email
      - run: npm run smoke:cli
      - name: End-to-end tests
        run: |
          npx playwright install --with-deps chromium
          npm run test:e2e
      - name: Server log
        if: always()
        run: cat server.log

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t rackboard:ci .
      - name: Run like Unraid (root-owned appdata bind mount) and wait for healthy
        run: |
          sudo mkdir -p /tmp/appdata && sudo chown root:root /tmp/appdata
          docker run -d --name rb -p 3000:3000 -v /tmp/appdata:/data rackboard:ci
          for i in $(seq 1 30); do curl -sf http://localhost:3000/api/health && break; sleep 1; done
          curl -sf http://localhost:3000/api/health || { docker logs rb; exit 1; }
      - name: Runs as nobody:users and can write /data
        run: |
          test "$(docker exec rb sh -c 'stat -c %u:%g /proc/1')" = "99:100"
          test "$(stat -c %u:%g /tmp/appdata/rackboard.db)" = "99:100"
          docker logs rb
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Smoke test against the container
        run: node scripts/smoke.js http://localhost:3000
      - name: Recovery CLI via docker exec keeps file ownership
        run: |
          docker exec rb node server/cli.js reset-password smoke cli-reset-pass-1
          curl -sf -X POST -H 'Content-Type: application/json' -d '{"username":"smoke","password":"cli-reset-pass-1"}' http://localhost:3000/api/auth/login > /dev/null
          test -z "$(sudo find /tmp/appdata ! -user 99)"
