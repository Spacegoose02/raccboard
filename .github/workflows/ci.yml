name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Start server
        run: |
          DATA_DIR="$RUNNER_TEMP/data" PORT=3000 npm start > server.log 2>&1 &
          for i in $(seq 1 30); do curl -sf http://localhost:3000/api/health && break; sleep 1; done
      - run: npm run smoke
      - run: npm run smoke:oidc
      - name: Server log
        if: always()
        run: cat server.log

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t rackboard:ci .
      - name: Run container and wait for healthy
        run: |
          docker run -d --name rb -p 3000:3000 rackboard:ci
          for i in $(seq 1 30); do curl -sf http://localhost:3000/api/health && exit 0; sleep 1; done
          docker logs rb; exit 1
