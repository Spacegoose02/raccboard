name: Windows Notes app

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to attach the installer to (e.g. v1.4.0)'
        required: true
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  exe:
    runs-on: windows-latest
    env:
      TAG: ${{ github.event.inputs.tag || github.ref_name }}
      GH_TOKEN: ${{ github.token }}
    defaults:
      run:
        shell: bash
        working-directory: desktop
    steps:
      # Manual runs build the workflow's own ref (main) and label it with the given tag,
      # so older tags that predate build fixes can still get an installer.
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npm version "${TAG#v}" --no-git-tag-version --allow-same-version
      - run: npx electron-builder --win nsis --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: raccboard-notes-windows
          path: desktop/dist/*.exe
      - name: Attach installer to release
        run: |
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --title "$TAG" --notes ""
          gh release upload "$TAG" dist/*.exe --clobber
