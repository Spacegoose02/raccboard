services:
  rackboard:
    build: .
    image: rackboard:latest
    container_name: rackboard
    ports:
      - "3000:3000"
    volumes:
      - ./data:/data
    environment:
      - TZ=America/New_York
      # - MAX_UPLOAD_MB=25
      # - ALLOW_SIGNUP=false
      # Behind a reverse proxy with HTTPS:
      # - TRUST_PROXY=true
      # - PUBLIC_URL=https://kanban.example.com
      # Single sign-on (Authentik, Authelia, Keycloak, Google…):
      # - OIDC_ISSUER=https://auth.example.com/application/o/rackboard/
      # - OIDC_CLIENT_ID=rackboard
      # - OIDC_CLIENT_SECRET=change-me
      # - OIDC_NAME=Authentik
      # Email (or set it up in Settings -> Email):
      # - SMTP_HOST=smtp.gmail.com
      # - SMTP_PORT=587
      # - SMTP_USER=you@gmail.com
      # - SMTP_PASS=your-app-password
      # - SMTP_FROM=Rackboard <you@gmail.com>
      # Google Calendar sync (needs PUBLIC_URL with https):
      # - GOOGLE_CLIENT_ID=xxxx.apps.googleusercontent.com
      # - GOOGLE_CLIENT_SECRET=change-me
    restart: unless-stopped
