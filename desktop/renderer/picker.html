<!doctype html>
<html><head><meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'">
<title>Raccboard Notes</title>
<link rel="stylesheet" href="picker.css">
</head><body>
<section id="login" hidden>
  <h1>🦝 Raccboard Notes</h1>
  <p class="muted">Sign in to your Raccboard server to pin cards to your desktop.</p>
  <form id="loginForm">
    <label>Server URL<input name="serverUrl" placeholder="http://192.168.1.10:3000" required></label>
    <label>Username<input name="username" autocomplete="username" required></label>
    <label>Password<input name="password" type="password" autocomplete="current-password" required></label>
    <button type="submit">Sign in</button>
    <p id="loginError" class="error"></p>
  </form>
</section>
<section id="main" hidden>
  <header><h1>Pin a card</h1><button id="signOut" class="link">Sign out</button></header>
  <p class="muted" id="who"></p>
  <input id="search" placeholder="Search cards…">
  <select id="board"></select>
  <div id="cards"></div>
  <p id="mainError" class="error"></p>
</section>
<script src="picker.js"></script>
</body></html>
